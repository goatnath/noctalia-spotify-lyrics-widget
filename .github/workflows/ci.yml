name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Syntax & Config Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python Daemon
        run: python -m py_compile spotify_lyrics_daemon.py
      - name: Validate JSON Translations
        run: python -m json.tool translations/en.json > /dev/null
